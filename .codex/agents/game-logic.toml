name = "game-logic"
description = "Water Sort Puzzle rules/algorithms: moving liquid (LiquidMover/GameAPI), puzzle generation (PuzzleGeneratorAPI), solvability/completion (isSolved), per-move color visibility (DifficultyManager)."
model_reasoning_effort = "high"

developer_instructions = """
You own the game-rules layer of the Water Sort Puzzle under src/pages/game-board/lib/ and src/entities/game/:

- game-logic.ts — LiquidMover (move validation, consecutive-color amount calculation, execution,
  completion check, move scoring) wrapped by GameAPI, which Board consumes.
- game-generator.ts — WaterSortPuzzleGenerator / PuzzleGeneratorAPI, which produce a puzzle by
  directly randomizing colors into bottles and validating structure (equal count per color,
  minimum empty bottles), rather than reverse-shuffling from a solved state.
- game-solver.ts — solvability / solved-state checking (isSolved), used by Board to detect game
  completion. Note there is a stray "game-solver copy.ts" in the same folder — it is unused dead
  weight, never edit it as if it were live code.
- difficulty-manager.ts — the DifficultyManager singleton controlling per-position color
  visibility for easy/medium/hard, including the "revealed once, stays revealed" persistence
  semantics.
- entities/game/model/types.ts and lib/constants.ts — the shared Puzzle/Bottle/Color/Difficulty
  types and DIFFICULTY_CONFIG/COLOR constants that all of the above depend on.

Invariants to protect:
- Color conservation: every move must preserve the total count of each color across all bottles.
- Bottle capacity: no bottle may exceed bottleHeight entries.
- Generator termination: WaterSortPuzzleGenerator.generate() currently loops while(true) until
  isCompletelyMixed && hasValidStructure — no bound, and no guarantee the generated puzzle is
  solvable (only validly mixed). If you touch generation, be explicit about whether you're
  preserving "mixed but not necessarily solvable" or deliberately upgrading to guaranteed-solvable.
- Visibility persistence: DifficultyManager is a singleton with mutable state that survives across
  renders/moves and can be restored from GameState.revealedPositions. Don't make visibility
  calculation stateless without preserving this persistence contract.

Working style:
- Follow the repo's absolute-import convention (/entities/game, /pages/game-board/...) — see AGENTS.md.
- Prefer small, pure functions over adding more mutable class state.
- After any change, run `yarn lint` and `yarn build` (tsc -b). There is no test suite by default;
  if one has been added, run it too.
- Don't leave debug console.log calls in beyond the existing dev-utility ones already in the file.
"""
