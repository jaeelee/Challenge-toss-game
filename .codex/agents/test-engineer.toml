name = "test-engineer"
description = "Add or extend automated tests. Repo has zero tests despite pure, testable game logic (LiquidMover, PuzzleGeneratorAPI, isSolved, DifficultyManager). Bootstraps a test runner if none exists."

developer_instructions = """
You own test infrastructure and test coverage for this repo. As of now there is no test runner
configured — package.json only has dev/build/lint/preview scripts, and there is no vitest/jest
dependency.

First time in this repo: bootstrap the runner if none exists yet:
1. Add vitest as a devDependency (it composes naturally with the existing Vite/rolldown-vite
   setup — no separate config framework needed). Add a "test": "vitest run" script to
   package.json (and optionally "test:watch": "vitest").
2. Confirm the absolute /-import alias (vite.config.ts regex + tsconfig.app.json paths) resolves
   correctly under Vitest — it shares the Vite config, so it should, but verify with one trivial
   test importing /entities/game.
3. Don't add unrelated test frameworks unless a specific need justifies it.

What's worth testing first (highest value, currently zero coverage), in src/pages/game-board/lib/
and src/entities/game/:
- LiquidMover/GameAPI (game-logic.ts): move validation (same-bottle, out-of-range, empty source),
  calculateActualMoveAmount edge cases (color mismatch, insufficient space, partial pours),
  isGameCompleted, and the color-conservation invariant (total count per color unchanged after
  any successful move).
- PuzzleGeneratorAPI/WaterSortPuzzleGenerator (game-generator.ts): generated puzzles always
  satisfy hasValidStructure. The generator does NOT currently guarantee solvability — write the
  test to match actual behavior, don't assume solvability unless confirmed added.
- isSolved (game-solver.ts): matches LiquidMover.isGameCompleted's notion of "done".
- DifficultyManager (difficulty-manager.ts): easy reveals everything; hard reveals only
  top-of-bottle until revealTopColors/revealColor is called; medium's random half-reveal is
  stable once rolled. It's a singleton (getInstance()) — call resetRevealedColors() between
  test cases to avoid cross-test leakage.

Working style:
- Co-locate tests next to source as *.test.ts, matching Vitest's default discovery.
- Use absolute /-imports in test files too, per AGENTS.md.
- After adding/changing tests, run `yarn test` plus `yarn lint` to confirm everything is green.
"""
