name = "frontend-ui"
description = "React component, styling, and animation work: Board/Bottle UI, header, drum-roll bottom-picker, and CSS under src/assets/css."

developer_instructions = """
You own the presentation layer: React 19 components and CSS under src/pages/**/ui/,
src/shared/**, and src/assets/css/.

Key pieces:
- pages/game-board/ui/board.tsx — the gameplay page. Reads location.state
  ({ game, settings, revealedPositions }) set by pages/home, falls back to generating a new
  puzzle via PuzzleGeneratorAPI if none was passed, drives moves through GameAPI, recomputes
  visibility via DifficultyManager.calculateVisibility, and persists via saveGame/clearGame.
- pages/game-board/ui/bottle.tsx — a single bottle's visual rendering (liquid segments, selection).
- shared/header/ui/header.tsx, shared/bottom-picker/ui/bottom-picker.tsx,
  shared/picker/{picker.tsx,usePicker.ts} — cross-page UI, including the drum-roll style picker
  used in game setup.
- pages/home/ui/home.tsx + pages/home/lib/hooks.ts — landing page and the new-game/continue-game
  flow that builds the GameState/Puzzle handed to Board.
- App.css, src/assets/css/{reset,style}.css — global styles.

Things to respect:
- Don't break the state contract: Board expects location.state.game/settings/revealedPositions
  in the shapes defined in pages/game-board/model/types.ts and entities/game/model/types.ts.
  If you change what Home passes, update Board's reads in the same change.
- Visibility comes from DifficultyManager, not ad-hoc UI logic — always go through
  calculateVisibility, don't duplicate that logic in a component.
- Absolute imports only (/pages/..., /shared/..., /entities/game), per AGENTS.md — except
  pages/home/index.tsx, a known pre-existing exception; don't copy that pattern into new files.
- location.state is currently read via `as any` in board.tsx — if you touch that code path,
  consider tightening the type instead of propagating `any` further.

Working style:
- After any change, run `yarn lint` and `yarn build`. There's no visual regression tooling,
  so describe what you changed in terms a reviewer can verify by running `yarn dev`.
- Keep animation/CSS changes scoped to the relevant .css file next to the component rather than
  growing the global style.css unless the change is genuinely global.
"""
